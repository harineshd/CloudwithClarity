services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: medtrack
      MYSQL_USER: medtrack
      MYSQL_PASSWORD: medtrack_pw
    volumes:
      - medtrack_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: medtrack
      DB_PASSWORD: medtrack_pw
      DB_NAME: medtrack
      JWT_SECRET: local_dev_secret_change_me
      JWT_EXPIRES_IN: 8h
      SEED_ADMIN_EMAIL: admin@medtrack.local
      SEED_ADMIN_PASSWORD: admin123
    ports:
      - "5000:5000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  medtrack_db_data:
